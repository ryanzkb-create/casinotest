<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Golden Mirage</title>
  <meta name="description" content="A 3D casino life simulator that shows why gambling always loses money.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;600&display=swap">
  <style>
/* Golden Mirage: single dark look (night on the Strip) */
:root {
  color-scheme: dark;
  --gold: #f2c14e;
  --gold-dim: #a8842c;
  --bg: #0d0f14;
  --panel: rgba(8, 10, 14, 0.72);
  --panel-solid: #14161d;
  --text: #eef1f5;
  --muted: #a3a9b5;
  --win: #72d572;
  --lose: #e0474c;
  --armor: #4fa3e0;
  --felt: #145a33;
  --display: "Anton", "Arial Narrow", Impact, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: var(--body);
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
canvas { display: block; }
#game, #game3d { position: fixed; inset: 0; width: 100%; height: 100%; }
.hidden { display: none !important; }
.win { color: var(--win); }
.lose { color: var(--lose); }
.push { color: var(--gold); }
.muted { color: var(--muted); font-size: 0.9em; }
b { font-weight: 700; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------------- HUD ---------------- */
#hud-top {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px;
  text-align: right; pointer-events: none; z-index: 20;
  text-shadow: 0 2px 3px rgba(0,0,0,0.9), 0 0 1px #000;
}
.hud-row { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
#weapon {
  pointer-events: auto; width: 64px; height: 52px; border-radius: 6px; background: var(--panel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 26px; line-height: 1;
  border: 1px solid rgba(255,255,255,0.12);
}
#weapon small { font-family: var(--label); font-size: 13px; font-weight: 700; margin-top: 2px; }
.cash { font-family: var(--display); font-size: clamp(28px, 4.4vw, 42px); color: var(--win); letter-spacing: 0.5px; line-height: 1; font-variant-numeric: tabular-nums; }
.debt-line { font-family: var(--display); font-size: 18px; color: var(--muted); letter-spacing: 0.5px; }
.debt-line b { font-weight: 400; }
.debt-line.danger b { color: var(--lose); }
#heat { font-size: 22px; color: #fff; letter-spacing: 2px; height: 26px; }
#heat span { color: rgba(255,255,255,0.18); }
.sub-line { font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
.sub-line.net b { font-family: var(--display); font-weight: 400; letter-spacing: 0.5px; }
.tier { color: var(--gold); }
#h-net.pos { color: var(--win); }
#h-net.neg { color: var(--lose); }
#debt-meter { margin-top: 6px; width: 180px; margin-left: auto; }
#debt-meter small { color: var(--lose); font-family: var(--label); font-weight: 700; letter-spacing: 0.08em; font-size: 11px; }
.meter { height: 7px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
#b-debt { height: 100%; background: linear-gradient(90deg, #f59e0b, #ff1f3d); transition: width 0.3s; }

#hud-radar {
  position: fixed; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 176px; z-index: 20; pointer-events: none;
}
#minimap {
  width: 176px; height: 176px; display: block; border-radius: 50%;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
}
.hbars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
.hbar { height: 8px; background: rgba(0,0,0,0.6); border: 1px solid rgba(0,0,0,0.8); overflow: hidden; }
.hbar div { height: 100%; transition: width 0.25s; }
.hbar.health div { background: #56b35a; }
.hbar.health.low div { background: var(--lose); animation: pulse 0.6s infinite alternate; }
.hbar.armor div { background: var(--armor); }
.vitals { background: var(--panel); border-radius: 4px; padding: 4px 8px; margin-top: 5px; }
.vital { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 12px; }
.vital span { width: 16px; text-align: center; }
.bar { flex: 1; height: 6px; background: rgba(255,255,255,0.12); border-radius: 1px; overflow: hidden; }
.fill { height: 100%; transition: width 0.3s; }
.fill.hunger { background: #f0a030; }
.fill.thirst { background: #38bdf8; }
.fill.energy { background: #b5e23c; }
.vital.low .fill { background: var(--lose); animation: pulse 0.8s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }

#corner-buttons { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 21; }
#corner-buttons button {
  width: 40px; height: 40px; border-radius: 50%; background: var(--panel); color: var(--text);
  border: 1px solid rgba(255,255,255,0.2); font-family: var(--display); font-size: 20px; cursor: pointer;
}
#action-buttons {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 10px; align-items: flex-end; z-index: 21;
}
#action-buttons button {
  position: relative; height: 56px; min-width: 56px; border-radius: 12px; background: var(--panel);
  border: 1px solid rgba(255,255,255,0.2); color: var(--text); cursor: pointer; font-size: 26px;
}
#weaponBtn { font-family: var(--display); font-size: 22px !important; }
#fireBtn {
  font-family: var(--display); font-size: 20px !important; letter-spacing: 1px; min-width: 76px !important;
  background: rgba(160, 20, 30, 0.8) !important; border-color: #ff6b6b !important;
}
#badge {
  position: absolute; top: -6px; right: -6px; background: var(--lose); color: #fff;
  font-family: var(--label); font-size: 13px; font-weight: 700; border-radius: 10px; padding: 1px 7px;
}

#prompt {
  position: fixed; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--panel); color: var(--text); padding: 9px 16px; border-radius: 4px;
  font-family: var(--label); font-weight: 600; font-size: 18px; letter-spacing: 0.02em; cursor: pointer; z-index: 22;
  max-width: calc(100vw - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#prompt b { background: var(--text); color: #111; padding: 0 7px; border-radius: 3px; margin-right: 8px; font-family: var(--display); font-weight: 400; }

/* GTA-style help text, top left */
#toasts {
  position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; flex-direction: column; gap: 6px;
  width: min(360px, calc(100vw - 32px)); pointer-events: none; z-index: 40;
}
.toast {
  background: rgba(0,0,0,0.78); padding: 10px 13px; border-radius: 3px;
  font-size: 15px; line-height: 1.4; transition: opacity 0.4s; animation: slidein 0.2s ease-out;
  border-left: 3px solid var(--gold);
}
.toast.danger { border-color: var(--lose); }
.toast.win { border-color: var(--win); }
.toast.phone { border-color: #60a5fa; }
.toast.lesson { border-color: #c084fc; }
.toast.fade { opacity: 0; }
.toast b { color: var(--gold); }
@keyframes slidein { from { transform: translateX(-20px); opacity: 0; } to { transform: none; opacity: 1; } }

#zone {
  position: fixed; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 19; pointer-events: none;
  font-family: var(--display); font-size: clamp(22px, 3.2vw, 34px); letter-spacing: 0.5px; color: #fff;
  text-shadow: 0 2px 4px #000, 0 0 2px #000; opacity: 0;
}
#zone.show { animation: zonefade 4s ease-out forwards; }
@keyframes zonefade { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #zone.show { animation: none; opacity: 1; } }
#bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
.bubble3d {
  position: absolute; left: 0; top: 0; background: rgba(255,255,255,0.95); color: #111;
  font-family: var(--label); font-weight: 600; font-size: 15px; padding: 5px 10px; border-radius: 12px;
  white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.4); will-change: transform;
}
.bubble3d::after {
  content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
  border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(255,255,255,0.95);
}
#hurt { position: fixed; inset: 0; pointer-events: none; z-index: 16; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(200, 0, 0, 0.55)); }
#hurt.flash { animation: hurt 0.5s ease-out; }
@keyframes hurt { from { opacity: 1; } to { opacity: 0; } }

.talk-role { font-family: var(--label); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-size: 13px; }
.talk-line { font-size: 18px; line-height: 1.45; }

/* ---------------- Buttons ---------------- */
.btn {
  font-family: var(--label); letter-spacing: 0.03em;
  background: #22242c; color: var(--text); border: 1px solid var(--gold-dim); border-radius: 10px;
  padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--gold); background: #3a2836; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #ffdd66, #d4a017); color: #1a1000; border-color: #ffe9a0; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffe88f, #e0ad22); }
.btn.ghost { background: transparent; }
.btn.danger { background: #8b1a1f; border-color: #ff6b6b; color: #fff; }
.btn.danger:hover:not(:disabled) { background: #a3222a; }
.btn.big { font-size: 20px; padding: 14px 30px; margin-top: 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }

/* ---------------- Modal ---------------- */
#modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
  align-items: center; justify-content: center; z-index: 50; padding: 12px;
}
.modal-box {
  background: linear-gradient(180deg, #24141f, #170c14); border: 2px solid var(--gold-dim);
  border-radius: 16px; width: min(640px, 100%); max-height: 92vh; overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.7);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid rgba(255,213,74,0.25); position: sticky; top: 0; background: #24141f; z-index: 1;
}
.modal-head h2 { margin: 0; font-family: var(--display); font-weight: 400; letter-spacing: 0.5px; font-size: 24px; color: var(--gold); }
#modal-close { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; }
#modal-body { padding: 14px 16px 18px; }
.info p { margin: 8px 0; line-height: 1.45; }
.info h3 { color: var(--gold); margin: 4px 0 8px; }
.info ul { margin: 6px 0; padding-left: 20px; line-height: 1.5; }
.statline { margin-top: 10px; padding: 6px 10px; background: rgba(255,255,255,0.06); border-radius: 8px; font-size: 13px; color: var(--muted); }

/* ---------------- Games ---------------- */
.game { text-align: center; }
.edge-note { font-size: 13px; color: #d8b4fe; background: rgba(120, 60, 180, 0.18); padding: 6px 10px; border-radius: 8px; }
.cash-line { margin: 8px 0; font-size: 16px; }
.cash-line b { color: var(--gold); }
.result { min-height: 28px; margin: 10px 0 4px; font-size: 17px; font-weight: 600; }
.result .sub { font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.flash { animation: pulse 0.3s 6 alternate; }

.betbox { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px; margin-top: 10px; }
.betbox.locked { opacity: 0.5; pointer-events: none; }
.bet-top { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; }
.bet-input {
  width: 150px; font-size: 18px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--gold-dim);
  background: #0e070c; color: var(--gold); text-align: right; font-weight: 700;
}
.bet-limits { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.chip {
  min-width: 46px; height: 40px; border-radius: 20px; border: 3px dashed #fff;
  background: #b91c1c; color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; padding: 0 8px;
}
.chip:nth-child(2) { background: #1d4ed8; } .chip:nth-child(3) { background: #15803d; }
.chip:nth-child(4) { background: #111; } .chip:nth-child(5) { background: #7e22ce; }
.chip:nth-child(6) { background: #c2410c; }
.chip.alt { background: #3a2836 !important; border-style: solid; border-color: var(--gold-dim); }

.reels { display: flex; justify-content: center; gap: 10px; margin: 14px 0 8px; }
.reel {
  width: 88px; height: 88px; font-size: 52px; display: flex; align-items: center; justify-content: center;
  background: #fff8e6; border-radius: 12px; border: 4px solid var(--gold); box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
}
.paytable { font-size: 12px; color: var(--muted); }

.wheel-result { display: flex; justify-content: center; margin: 12px 0; }
.ball {
  width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-weight: 800; border: 5px solid var(--gold); color: #fff;
}
.ball.red, .dot.red { background: #c1121f; }
.ball.black, .dot.black { background: #111; }
.ball.green, .dot.green { background: #15803d; }
.ball.gold { background: #7a2a1a; font-size: 22px; width: 110px; height: 110px; }
.history { font-size: 13px; color: var(--muted); min-height: 24px; }
.dot { display: inline-block; min-width: 24px; padding: 2px 4px; margin: 2px; border-radius: 12px; color: #fff; font-size: 12px; }
.bet-types { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
.opt {
  background: #0f3a24; color: #fff; border: 2px solid transparent; border-radius: 8px; padding: 6px 10px;
  cursor: pointer; font-weight: 600; min-width: 74px;
}
.opt small { display: block; font-size: 11px; opacity: 0.75; font-weight: 400; }
.opt.red { background: #8b0f1a; } .opt.black { background: #111; }
.opt.on { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,213,74,0.5); }
.straight-pick select { font-size: 16px; padding: 4px; border-radius: 6px; }

.bj-area { background: var(--felt); border-radius: 14px; padding: 10px; margin-top: 10px; border: 3px solid #5a3a16; }
.lbl { font-size: 13px; color: #d1fae5; text-align: left; }
.hand { display: flex; gap: 6px; min-height: 76px; justify-content: center; margin: 4px 0 8px; flex-wrap: wrap; }
.card {
  width: 50px; height: 72px; background: #fff; color: #111; border-radius: 6px; font-size: 20px; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  animation: deal 0.25s ease-out;
}
.card span { font-size: 22px; }
.card.red { color: #c1121f; }
.card.back { background: repeating-linear-gradient(45deg, #7f1d1d, #7f1d1d 6px, #991b1b 6px, #991b1b 12px); color: transparent; }
@keyframes deal { from { transform: translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }

.dice { font-size: 70px; line-height: 1; margin: 6px 0; }
.dice span { margin: 0 6px; }
.point { color: var(--gold); font-weight: 700; }
.craps-log { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 4px; }
.craps-log span { display: inline-block; background: rgba(255,255,255,0.08); border-radius: 4px; padding: 1px 6px; margin: 1px; }

/* ---------------- Phone ---------------- */
#phone {
  position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: flex-end;
  padding: 12px 20px; background: rgba(0,0,0,0.35);
}
.phone-frame {
  width: min(360px, 100%); height: min(700px, 94vh); background: #0b0b10; border: 10px solid #222;
  border-radius: 36px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
}
.phone-notch { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 13px; color: #ddd; background: #000; }
#phone-close { background: none; border: none; color: #ddd; font-size: 18px; cursor: pointer; }
#phone-screen { flex: 1; overflow-y: auto; background: linear-gradient(180deg, #1b1530, #0e0b18); padding: 10px 14px 20px; }
.phone-back { background: none; border: none; color: #60a5fa; font-size: 15px; cursor: pointer; padding: 4px 0; }
.phone-body h3 { margin: 6px 0 10px; }
.phone-status { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px; line-height: 1.6; font-size: 14px; }
.app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.app-icon {
  position: relative; background: none; border: none; color: #eee; font-size: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.app-icon span {
  font-size: 32px; width: 62px; height: 62px; border-radius: 16px; background: linear-gradient(135deg, #3b2a5a, #1e1633);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
.dot-badge { position: absolute; top: -4px; right: 6px; background: var(--lose); color: #fff; font-style: normal; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
.card-box { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px; margin: 8px 0; line-height: 1.6; font-size: 14px; }
.card-box ul { padding-left: 18px; margin: 4px 0; }
.card-box p { margin: 6px 0; }
.phone-sub { font-weight: 700; color: var(--gold); margin: 14px 0 6px; }
.phone-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pbtn { flex: 1; min-width: 90px; background: #2a2340; color: #fff; border: 1px solid #4b3f75; border-radius: 10px; padding: 10px 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.pbtn.primary { background: #1d4ed8; border-color: #60a5fa; }
.pbtn.danger { background: #991b1b; border-color: #ef4444; }
.chat { display: flex; flex-direction: column; gap: 6px; }
.bubble { background: #2a2a35; border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: 14px; line-height: 1.4; margin: 4px 0; }
.msg { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 13px; line-height: 1.4; }
.msg-from { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 2px; }
.msg-from span { font-weight: 400; color: var(--muted); font-size: 11px; }
.stats-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
.stats-table th, .stats-table td { padding: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
.tier-card { text-align: center; }
.tier-name { font-size: 26px; font-weight: 800; color: var(--gold); }
.progress { height: 10px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; margin: 8px 0; }
.progress div { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }

/* ---------------- Full screens ---------------- */
#screen {
  position: fixed; inset: 0; z-index: 60; background: linear-gradient(180deg, rgba(10,6,16,0.82), rgba(5,4,8,0.94));
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
}
.screen-box { max-width: 820px; width: 100%; text-align: center; margin: auto; }
.screen-box h1 { font-family: var(--display); font-weight: 400; color: var(--gold); font-size: clamp(40px, 9vw, 84px); letter-spacing: 1px; line-height: 1; margin: 6px 0 10px; text-wrap: balance; text-shadow: 0 0 24px rgba(242,193,78,0.45); }
.intro-kicker { font-family: var(--label); font-weight: 700; letter-spacing: 0.25em; color: #ff4f8b; font-size: 14px; }
.screen-box p { line-height: 1.5; }
.tagline { font-size: 18px; }
.intro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; text-align: left; margin: 18px 0; }
.intro-grid > div { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 14px; }
.intro-grid h3 { margin: 4px 0; color: var(--gold); font-family: var(--label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.intro-grid p { font-size: 14px; margin: 6px 0; }
.warning { background: rgba(255, 92, 108, 0.12); border: 1px solid rgba(255, 92, 108, 0.5); border-radius: 10px; padding: 10px; }
.end-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px; margin: 16px 0; text-align: left; }

'use strict';

// ---------------------------------------------------------------------------
// Core configuration. Every game below uses real-world casino odds, so the
// house edge always wins in the long run.
// ---------------------------------------------------------------------------
const CONFIG = {
  START_CASH: 2_000_000,
  GAME_OVER_DEBT: 1_000_000,
  BROKE_THRESHOLD: 1_000,       // loans unlock once cash drops below this
  MIN_PER_SEC: 2,               // game minutes that pass per real second on the map
  DECAY: {                      // points lost per game minute
    hunger: 100 / 960,          // empty in 16 hours
    thirst: 100 / 600,          // empty in 10 hours
    energy: 100 / 1200,         // empty in 20 hours
  },
  BANK: { maxTotal: 250_000, rate: 0.002, lateRate: 0.006, termDays: 10, lateFee: 0.10 },
  SHARK: { maxOutstanding: 700_000, rate: 0.10, termDays: 3, extendDays: 2, penalty: 0.05 },
  HOSPITAL_BILL: 8_000,
  TRAUMA_BILL: 25_000,
  HOTEL_PRICE: 450,
};

const TIERS = [
  { name: 'Bronze',   min: 0,          perks: 'No perks yet. "Keep playing to earn rewards!"' },
  { name: 'Silver',   min: 50_000,     perks: 'Free drinks at the bar' },
  { name: 'Gold',     min: 250_000,    perks: 'Free drinks + free buffet' },
  { name: 'Platinum', min: 1_000_000,  perks: 'Free drinks, buffet + free hotel room' },
  { name: 'Diamond',  min: 5_000_000,  perks: 'Everything + the penthouse suite' },
];

let S = null;

function newState() {
  return {
    cash: CONFIG.START_CASH,
    minutes: 20 * 60, // Day 1, 8:00 PM
    hunger: 85, thirst: 80, energy: 90,
    health: 100, armor: 0,
    weapons: { pistol: false, shotgun: false },
    ammo: { pistol: 0, shotgun: 0 },
    equipped: null,
    marked: false,          // flashed a big win, robbers notice
    nextRobber: 20 * 60 + 90,
    tonyAngry: 0,
    bank: { owed: 0, principal: 0, borrowedTotal: 0, due: null, late: false, credit: 'good' },
    shark: { owed: 0, principal: 0, due: null, overdueDays: 0, nextThug: null, reminded: false },
    medical: 0,
    inventory: { watch: true, ring: true, laptop: true },
    lastSoupDay: -1,
    tierIdx: 0,
    brokeNotified: false,
    lowWarned: {},
    messages: [],
    unread: 0,
    lessonsShown: {},
    ended: false,
    stats: {
      wagered: 0, returned: 0, rounds: 0, expectedLoss: 0,
      biggestWin: 0, peakCash: CONFIG.START_CASH, lossStreak: 0,
      games: {}, compsValue: 0, borrowed: 0, interest: 0, harassed: 0, collapses: 0,
      robbed: 0, robbedAmount: 0, fightsWon: 0, gunSpend: 0,
    },
  };
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function fmt(n) {
  const neg = n < 0;
  const v = Math.round(Math.abs(n));
  return (neg ? '-' : '') + '$' + v.toLocaleString('en-US');
}

function fmtShort(n) {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return s + '$' + (a / 1e3).toFixed(1) + 'K';
  return fmt(n);
}

function clockText(min = S.minutes) {
  const day = Math.floor(min / 1440) + 1;
  const m = Math.floor(min % 1440);
  const h = Math.floor(m / 60), mm = m % 60;
  const h12 = ((h + 11) % 12) + 1;
  return `Day ${day}, ${h12}:${String(mm).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
}

function durationText(mins) {
  if (mins <= 0) return 'now';
  const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = Math.floor(mins % 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
}

function totalDebt() { return S.bank.owed + S.shark.owed + S.medical; }
function netWorth() { return S.cash - totalDebt(); }

function tierIndex() {
  let idx = 0;
  TIERS.forEach((t, i) => { if (S.stats.wagered >= t.min) idx = i; });
  return idx;
}
function hasTier(name) { return tierIndex() >= TIERS.findIndex(t => t.name === name); }

function addMsg(from, text) {
  S.messages.push({ from, text, time: S.minutes });
  S.unread++;
  if (typeof toast === 'function') toast(`📱 New message from ${from}`, 'phone');
}

// ---------------------------------------------------------------------------
// Time: hunger/thirst/energy decay and loan interest compounds.
// ---------------------------------------------------------------------------
function advanceTime(mins, sleeping = false) {
  if (S.ended || mins <= 0) return;
  const f = sleeping ? 0.35 : 1;
  const floor = sleeping ? 3 : 0; // you don't starve to death in your sleep
  S.hunger = clamp(S.hunger - CONFIG.DECAY.hunger * mins * f, Math.min(floor, S.hunger), 100);
  S.thirst = clamp(S.thirst - CONFIG.DECAY.thirst * mins * f, Math.min(floor, S.thirst), 100);
  if (!sleeping) S.energy = clamp(S.energy - CONFIG.DECAY.energy * mins, 0, 100);
  S.health = clamp(S.health + mins * (sleeping ? 0.15 : 0.03), 0, 100); // slow healing

  const days = mins / 1440;
  if (S.bank.owed > 0) {
    const r = S.bank.late ? CONFIG.BANK.lateRate : CONFIG.BANK.rate;
    const before = S.bank.owed;
    S.bank.owed *= Math.pow(1 + r, days);
    S.stats.interest += S.bank.owed - before;
  }
  if (S.shark.owed > 0) {
    const before = S.shark.owed;
    S.shark.owed *= Math.pow(1 + CONFIG.SHARK.rate, days);
    S.stats.interest += S.shark.owed - before;
  }
  S.minutes += mins;
  checkDeadlines();
}

const THREATS = [
  "You're late. That's not smart. The vig don't stop and neither do my boys.",
  "Two days late. My associates are getting impatient. They know what you look like.",
  "I'm done talking. You know what happens now.",
  "Every day you don't pay, it costs more. Every day you don't pay, it hurts more.",
];

function checkDeadlines() {
  const b = S.bank;
  if (b.owed > 0.5 && b.due !== null && !b.late && S.minutes > b.due) {
    b.late = true;
    b.credit = 'bad';
    const fee = b.owed * CONFIG.BANK.lateFee;
    b.owed += fee;
    addMsg('🏦 First National Bank',
      `NOTICE OF DELINQUENCY: Your loan is past due. A late fee of ${fmt(fee)} has been added, your rate has been raised to ${(CONFIG.BANK.lateRate * 100).toFixed(1)}% per day, and your account has been reported to the credit bureaus. You are no longer eligible for credit.`);
  }

  const k = S.shark;
  if (k.owed > 0.5 && k.due !== null) {
    if (!k.reminded && k.due - S.minutes < 720 && S.minutes < k.due) {
      k.reminded = true;
      addMsg('🦈 Tony', `Friendly reminder: you owe me ${fmt(k.owed)}. Due in ${durationText(k.due - S.minutes)}. Don't make this unfriendly.`);
    }
    if (S.minutes > k.due) {
      const od = Math.floor((S.minutes - k.due) / 1440) + 1;
      while (k.overdueDays < od) {
        k.overdueDays++;
        k.owed *= 1 + CONFIG.SHARK.penalty;
        addMsg('🦈 Tony', THREATS[Math.min(k.overdueDays - 1, THREATS.length - 1)] +
          ` (Late penalty added. You now owe ${fmt(k.owed)}.)`);
      }
      if (k.nextThug === null) k.nextThug = S.minutes + 30;
    }
  }
}

function sharkOverdue() {
  return S.shark.owed > 0.5 && S.shark.due !== null && S.minutes > S.shark.due;
}

// ---------------------------------------------------------------------------
// Betting bookkeeping. Cash is removed when a bet is placed, and the total
// amount returned (stake + winnings) is added back on settlement.
// ---------------------------------------------------------------------------
function takeBet(amount) {
  if (!(amount > 0) || amount > S.cash + 1e-9) return false;
  S.cash -= amount;
  return true;
}

function settle(game, bet, returned, edge) {
  const st = S.stats;
  S.cash += returned;
  st.wagered += bet;
  st.returned += returned;
  st.rounds++;
  st.expectedLoss += bet * edge;
  const g = st.games[game] || (st.games[game] = { rounds: 0, wagered: 0, returned: 0, edge });
  g.rounds++; g.wagered += bet; g.returned += returned;

  const profit = returned - bet;
  if (profit > st.biggestWin) st.biggestWin = profit;
  if (profit >= 25_000) {
    S.marked = true; // people saw you win
    if (typeof crowdReact === 'function') crowdReact();
  }
  if (S.cash > st.peakCash) st.peakCash = S.cash;
  st.lossStreak = profit < 0 ? st.lossStreak + 1 : 0;

  advanceTime(2);
  commentary(profit, bet);
  checkTierUp();
  afterAction();
  return profit;
}

function commentary(profit, bet) {
  const st = S.stats;
  if (profit >= bet * 5 && profit >= 5000)
    lesson('bigwin', 'Big wins feel amazing and they are exactly what keeps people playing. The odds on your next bet are just as bad as before.');
  if (st.lossStreak === 6)
    lesson('fallacy', "Gambler's fallacy: after a losing streak, a win is NOT \"due\". Every spin, hand and roll is independent.");
  if (st.rounds === 25)
    lesson('edge25', `After 25 bets the house edge has already quietly taken about ${fmt(st.expectedLoss)} from you.`);
  if (st.rounds === 150)
    lesson('edge150', 'The more you play, the closer your results get to the house edge. That is the law of large numbers, and it is how casinos make money.');
  if (S.cash < CONFIG.START_CASH * 0.5)
    lesson('half', 'You have lost half of your $2,000,000. Chasing losses (betting more to win it back) is one of the most common signs of problem gambling.');
}

function checkTierUp() {
  const idx = tierIndex();
  if (idx > S.tierIdx) {
    S.tierIdx = idx;
    const t = TIERS[idx];
    addMsg('🎩 Casino Host', `Congratulations! You've reached ${t.name} status. Perks: ${t.perks}. We value your loyalty!`);
    lesson('comps' + idx, `Comps (free stuff) are marketing. You got ${t.name} status by betting ${fmt(S.stats.wagered)}, which statistically cost you about ${fmt(S.stats.expectedLoss)}.`);
  }
}

  <script>
'use strict';

const $ = sel => document.querySelector(sel);

let modalOpen = false;
let screenOpen = false;
let modalOnClose = null;

function toast(text, kind = 'info', ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = text;
  $('#toasts').appendChild(el);
  const life = ms || (kind === 'lesson' ? 9000 : 3500);
  setTimeout(() => el.classList.add('fade'), life - 400);
  setTimeout(() => el.remove(), life);
  const all = $('#toasts').children;
  while (all.length > 5) all[0].remove();
}

function lesson(key, text) {
  if (S.lessonsShown[key]) return;
  S.lessonsShown[key] = true;
  toast('💡 ' + text, 'lesson');
}

function openModal(title, bodyEl, onClose) {
  $('#modal-title').textContent = title;
  const body = $('#modal-body');
  body.innerHTML = '';
  if (typeof bodyEl === 'string') body.innerHTML = bodyEl;
  else body.appendChild(bodyEl);
  $('#modal').classList.remove('hidden');
  modalOpen = true;
  modalOnClose = onClose || null;
  if (typeof clearMovement === 'function') clearMovement();
}

function closeModal(force = false) {
  if (!modalOpen) return;
  if (modalOnClose) {
    const ok = modalOnClose();
    if (!force && ok === false) return; // round in progress
  }
  $('#modal').classList.add('hidden');
  $('#modal-close').classList.remove('hidden');
  modalOpen = false;
  modalOnClose = null;
}

// Simple info dialog with action buttons: [{label, cls, fn}]
function infoDialog(title, html, buttons = []) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="info">${html}</div>`;
  const row = document.createElement('div');
  row.className = 'btn-row';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls || '');
    btn.innerHTML = b.label;
    if (b.disabled) btn.disabled = true;
    btn.onclick = () => b.fn(btn);
    row.appendChild(btn);
  });
  const close = document.createElement('button');
  close.className = 'btn ghost';
  close.textContent = 'Leave';
  close.onclick = () => closeModal();
  row.appendChild(close);
  wrap.appendChild(row);
  openModal(title, wrap);
  return wrap;
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
let hudTimer = 0;
function updateHUD(force) {
  const now = performance.now();
  if (!force && now - hudTimer < 100) return;
  hudTimer = now;
  $('#h-cash').textContent = fmt(S.cash);
  const debt = totalDebt();
  $('#h-debt').textContent = fmt(debt);
  $('#h-debt').parentElement.classList.toggle('danger', debt > 0);
  const net = netWorth() - CONFIG.START_CASH;
  $('#h-net').textContent = (net >= 0 ? '+' : '') + fmt(net);
  $('#h-net').className = net >= 0 ? 'pos' : 'neg';
  $('#h-time').textContent = clockText();
  $('#h-tier').textContent = TIERS[tierIndex()].name;
  ['hunger', 'thirst', 'energy'].forEach(k => {
    const v = S[k];
    const bar = $('#b-' + k);
    bar.style.width = v + '%';
    bar.parentElement.parentElement.classList.toggle('low', v < 25);
  });
  $('#b-health').style.width = S.health + '%';
  $('#b-health').parentElement.classList.toggle('low', S.health < 30);
  $('#b-armor').style.width = S.armor + '%';
  const heat = sharkOverdue() ? Math.min(5, S.shark.overdueDays + S.tonyAngry) : 0;
  $('#heat').innerHTML = heat ? '★'.repeat(heat) + '<span>' + '★'.repeat(5 - heat) + '</span>' : '';
  const debtPct = clamp(debt / CONFIG.GAME_OVER_DEBT * 100, 0, 100);
  $('#b-debt').style.width = debtPct + '%';
  $('#debt-meter').classList.toggle('hidden', debt <= 0);
  const badge = $('#badge');
  badge.textContent = S.unread;
  badge.classList.toggle('hidden', S.unread === 0);
}

// ---------------------------------------------------------------------------
// Full-screen overlays (intro, endings)
// ---------------------------------------------------------------------------
function showScreen(html) {
  const s = $('#screen');
  s.innerHTML = `<div class="screen-box">${html}</div>`;
  s.classList.remove('hidden');
  screenOpen = true;
  if (typeof clearMovement === 'function') clearMovement();
  return s;
}
function hideScreen() {
  $('#screen').classList.add('hidden');
  screenOpen = false;
}

const PLAYER_R = 11;

function hits(x, y, r = PLAYER_R) {
  if (x - r < 0 || y - r < 0 || x + r > WORLD.w || y + r > WORLD.h) return true;
  for (const o of OBJECTS) {
    if (!o.solid) continue;
    if (x + r > o.x && x - r < o.x + o.w && y + r > o.y && y - r < o.y + o.h) return true;
  }

}

function randomWalkable(area) {

function moveEntity(e, dx, dy, r = PLAYER_R) {
  let moved = false;
  if (dx && !hits(e.x + dx, e.y, r)) { e.x += dx; moved = true; }
  if (dy && !hits(e.x, e.y + dy, r)) { e.y += dy; moved = true; }
  return moved;
}

function distToRect(x, y, o) {
  const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);

function isOutside(e = player) { return e.y > CASINO_BOTTOM; }

// Nearest thing you can use: an object or a person to talk to.
function nearbyTarget() {
  let best = null, bd = 30;
  for (const o of OBJECTS) {
    if (!o.type) continue;
    const d = distToRect(player.x, player.y, o) - PLAYER_R;
    if (d < bd) { bd = d; best = o; }
  }
  for (const n of npcs) {
    if (!n.talk || n.pose === 'down') continue;
    const d = Math.hypot(n.x - player.x, n.y - player.y) - PLAYER_R - 12;
    if (d < bd - 4) { bd = d; best = n; }
  }

}

        pinch.set(e.pointerId, { x: e.clientX, y: e.clientY });

      }

      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
      if (drag.moved) view.yaw -= (e.clientX - drag.x) * 0.006;

    });
    const up = e => {
      pinch.delete(e.pointerId);
      if (!drag || e.pointerId !== drag.id) return;

      drag = null;
      if (wasTap && !blocked()) tapAt(e.clientX, e.clientY);

    cv.addEventListener('pointercancel', e => { pinch.delete(e.pointerId); drag = null; });

      e.preventDefault();

function tapAt(cx, cy) {
  let hit;
  if (window.Render3D && Render3D.ready) hit = Render3D.pick(cx, cy);
  else {
    const wx = cx + camera2d.x, wy = cy + camera2d.y;
    hit = { x: wx, y: wy, target: OBJECTS.find(o => o.type && wx >= o.x && wx <= o.x + o.w && wy >= o.y && wy <= o.y + o.h) || null };

  if (!hit) return;
  const t = hit.target;
  if (t && t.hostile) { fireWeapon(t); return; }
  if (t) {
    const near = t.role ? Math.hypot(t.x - player.x, t.y - player.y) < 45 : distToRect(player.x, player.y, t) - PLAYER_R < 30;
    if (near) { useTarget(t); return; }
    if (t.role) player.target = { x: t.x, y: t.y, obj: t };

// Update
// ---------------------------------------------------------------------------
let stuckTime = 0;
function updateWorld(dt) {
  let ix = 0, iy = 0;
  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;

  let dx = 0, dy = 0;
  if (ix || iy) {
    player.target = null;
    // camera-relative: forward = away from camera
    const fx = -Math.sin(view.yaw), fy = -Math.cos(view.yaw);
    const rx = Math.cos(view.yaw), ry = -Math.sin(view.yaw);
    dx = rx * ix + fx * -iy;
    dy = ry * ix + fy * -iy;
  }

  if (player.target) {
    const t = player.target;
    const arrived = t.obj && (t.obj.role
      ? Math.hypot(t.obj.x - player.x, t.obj.y - player.y) < 40
      : distToRect(player.x, player.y, t.obj) - PLAYER_R < 28);
    if (arrived) {
      player.target = null;
      useTarget(t.obj);
    } else {
      const tx = t.obj && t.obj.role ? t.obj.x : t.x, ty = t.obj && t.obj.role ? t.obj.y : t.y;
      const vx = tx - player.x, vy = ty - player.y, d = Math.hypot(vx, vy);
      if (d < 4) player.target = null;
      else { dx = vx / d; dy = vy / d; }
    }
  }

  const run = keys['shift'] ? 1.5 : 1;
  const speed = player.speed * run * (S.energy < 20 ? 0.6 : 1) * (S.health < 30 ? 0.7 : 1);
  player.moving = false;
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    let moved = moveEntity(player, dx / len * speed * dt, dy / len * speed * dt);
    if (!moved && player.target) {
      const base = Math.atan2(dy, dx);
      for (const off of [0.8, -0.8, 1.57, -1.57]) {
        const a = base + off;
        if (moveEntity(player, Math.cos(a) * speed * dt, Math.sin(a) * speed * dt)) { moved = true; break; }
      }
    }
    player.moving = moved;
    const want = Math.atan2(dx, dy);
    player.face = lerpAngle(player.face, want, Math.min(1, dt * 12));
    if (!moved && player.target) {
      stuckTime += dt;
      if (stuckTime > 0.6) { player.target = null; stuckTime = 0; }
    } else stuckTime = 0;
  }
  player.anim += dt * (player.moving ? speed / 20 : 1);
  player.pose = player.shootT > 0 ? 'aim' : player.moving ? (run > 1 ? 'run' : 'walk') : 'stand';
  player.shootT = Math.max(0, player.shootT - dt);

  updateNPCs(dt);

  for (const c of cars) {
    c.x += (c.lane < 2 ? -1 : 1) * c.speed * dt;
    if (c.x > WORLD.w + 200) c.x = -200;
    if (c.x < -200) c.x = WORLD.w + 200;
  }

  updateCombat(dt);
}

function lerpAngle(a, b, t) {
  let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

      L.female = false; L.top = '#262626'; L.bottom = '#1c2230'; L.hat = 'hood'; L.mask = true; L.skirt = false; L.beard = false; break;
    case 'thug':
      L.female = false; L.top = '#141414'; L.jacket = '#2a1d14'; L.bottom = '#15151d'; L.shades = true; L.hairStyle = 'slick'; L.build = 1.25; L.skirt = false; L.hat = null; break;
    case 'pedestrian':
      if (Math.random() < 0.3) L.hat = 'cap';
      break;
  }
  return L;
}

function makeNPC(role, x, y, opts = {}) {
  const female = opts.female;
  const look = makeLook(role, female);
  return Object.assign({
    role, x, y, look,
    name: opts.name || (look.female ? pick(FEMALE_NAMES) : pick(MALE_NAMES)),
    face: opts.face !== undefined ? opts.face : 0, pose: 'stand', anim: rand(0, 10),
    tx: x, ty: y, wait: rand(0, 4), speed: rand(35, 60), area: null,
    bubble: null, bubbleT: 0, talk: true, hp: 100, hostile: false,
  }, opts);
}

// Seats in front of tables & machines (the renderer draws stools here)
function tableSeats(o) {
  const n = o.type === 'bigsix' ? 0 : o.type === 'craps' ? 4 : 3;
  const seats = [];
  for (let i = 0; i < n; i++) seats.push({ x: o.x + o.w * (i + 1) / (n + 1), y: o.y + o.h + 14 });
  return seats;
}
function slotSeat(o) { return { x: o.x + o.w / 2, y: o.y + o.h + 14 }; }

const DEALER_TABLES = ['blackjack', 'blackjack_hl', 'baccarat', 'baccarat_hl', 'roulette', 'craps', 'bigsix'];

function spawnNPCs() {
  npcs = [];
  const face = { south: 0, north: Math.PI };
  for (const o of OBJECTS) {
    if (DEALER_TABLES.includes(o.type)) {
      npcs.push(makeNPC('dealer', o.x + o.w / 2, o.y - 14, { face: face.south, table: o }));
      tableSeats(o).forEach(s => {
        if (Math.random() < 0.55) npcs.push(makeNPC('gambler', s.x, s.y, { face: face.north, pose: 'sit', seated: true }));
      });
    }
    if (o.type === 'slots' && Math.random() < 0.4) {
      const s = slotSeat(o);
      npcs.push(makeNPC('gambler', s.x, s.y, { face: face.north, pose: 'sit', seated: true, slot: o }));
    }
  }
  const staff = [
    ['bartender', 1585, 505, 'bar'], ['vendor', 1480, 76, 'hotdog'], ['vendor', 1655, 76, 'buffet'],
    ['vendor', 1505, 246, 'steak'], ['clerk', 1540, 766, 'hotel'], ['cashierClerk', 160, 656, 'cashier'],
  ];
  staff.forEach(([role, x, y, service]) => npcs.push(makeNPC(role, x, y, { face: face.south, service })));
  npcs.push(makeNPC('guard', 830, 962, { face: face.south, name: 'Officer Reyes' }));
  npcs.push(makeNPC('guard', 970, 962, { face: face.south, name: 'Officer Dunn' }));
  npcs.push(makeNPC('guard', 1000, 300, { area: 'casino', speed: 45, name: 'Officer Park' }));
  npcs.push(makeNPC('waitress', 900, 520, { area: 'casino', speed: 55 }));
  npcs.push(makeNPC('waitress', 300, 300, { area: 'casino', speed: 55 }));
  for (let i = 0; i < 10; i++) {
    const p = randomWalkable('casino');
    npcs.push(makeNPC('gambler', p.x, p.y, { area: 'casino' }));
  }
  npcs.push(makeNPC('homeless', 228, 1060, { face: face.south, pose: 'sit', name: 'Eddie' }));
  for (let i = 0; i < 5; i++) {
    const p = randomWalkable('street');
    npcs.push(makeNPC('pedestrian', p.x, p.y, { area: 'street', speed: rand(45, 70) }));
  }
}

function sayBubble(n, text, secs = 4) { n.bubble = text; n.bubbleT = secs; }

let chatterT = 3;
function updateNPCs(dt) {
  for (const n of npcs) {
    n.anim += dt;
    if (n.bubbleT > 0) { n.bubbleT -= dt; if (n.bubbleT <= 0) n.bubble = null; }
    if (n.hostile || n.role === 'robber' || n.role === 'thug') continue; // combat.js drives these
    if (n.pose === 'down') continue;
    if (!n.area) { n.pose = n.seated ? 'sit' : 'stand'; continue; }
    if (n.wait > 0) { n.wait -= dt; n.pose = 'stand'; continue; }
    const vx = n.tx - n.x, vy = n.ty - n.y, d = Math.hypot(vx, vy);
    if (d < 3) {
      n.wait = rand(1.5, 7);
      const p = randomWalkable(n.area); n.tx = p.x; n.ty = p.y;
      n.pose = 'stand';
      continue;
    }
    n.pose = 'walk';
    n.face = lerpAngle(n.face, Math.atan2(vx, vy), Math.min(1, dt * 6));
    if (!moveEntity(n, vx / d * n.speed * dt, vy / d * n.speed * dt, 10)) {
      const p = randomWalkable(n.area); n.tx = p.x; n.ty = p.y;
    }
  }

  // Ambient chatter near the player
  chatterT -= dt;
  if (chatterT <= 0) {
    chatterT = rand(3, 6);
    const near = npcs.filter(n => !n.bubble && !n.hostile && n.pose !== 'down' && AMBIENT[n.role] &&
      Math.hypot(n.x - player.x, n.y - player.y) < 320);
    if (near.length) { const n = pick(near); sayBubble(n, pick(AMBIENT[n.role])); }
  }
}

const AMBIENT = {
  gambler: ['Come on, lucky seven!', 'Just one more spin…', "I'm due for a win!", 'Daddy needs a new pair of shoes!', 'Not again…',
    "It's gotta hit soon.", 'Where did the night go?', 'Hit me!', 'I was up twenty grand an hour ago…', 'ATM, be right back.'],
  dealer: ['Place your bets.', 'No more bets!', 'Good luck, folks.', 'Winner on the table.', 'Dealer wins.'],
  waitress: ['Cocktails? Cocktails!', 'Complimentary drinks for players!', 'Can I get you anything?'],
  guard: ['Keep it moving.', 'Evening.', 'No photos on the floor, please.'],
  pedestrian: ['Vegas, baby!', 'Where is my hotel again?', 'I just lost my rent money…', 'Hey, watch it!', "What a night."],
  homeless: ['Spare some change?', 'God bless.', 'Cold one tonight…'],
  bartender: ['What can I get you?', 'Last call is never.'],
  vendor: ['Hot dogs! Get your hot dogs!', 'Buffet is open!'],
};

function crowdReact() {
  npcs.forEach(n => {
    if ((n.role === 'gambler' || n.role === 'dealer' || n.role === 'waitress') && Math.hypot(n.x - player.x, n.y - player.y) < 260)
      sayBubble(n, pick(['Whoa!', 'Nice hit!', 'Lucky!', 'Let it ride!', 'Share the love!', 'Big winner!']), 5);
  });
  lesson('marked', 'People noticed your big win. Word travels fast. Robbers look for people carrying winnings outside at night.');
}

// ---------------------------------------------------------------------------
// Conversations
// ---------------------------------------------------------------------------
const GAMBLER_LINES = [
  "I've been here fourteen hours. I'm due for a big one, I can feel it.",
  "Don't tell my wife I'm here. I told her I was at a conference.",
  'I was up $40,000 last night. Then I kept playing…',
  "See that machine? It hasn't paid out all day. It's gotta hit soon!",
  'My system never fails. Double after every loss! …I\'m just having a bad run.',
  'I only came for the free buffet. That was three days ago.',
  'You notice there are no clocks in here? What time is it, anyway?',
  'I lost my house because of this place. I still come back. Don\'t know why.',
  'Diamond status, baby! They comp my room. …I lost $300,000 to get it.',
  'The trick is to quit while you\'re ahead. I\'ll quit right after this next win.',
];
const PED_LINES = [
  'You heading into the Golden Mirage? Good luck, you\'ll need it.',
  'Watch your wallet around here at night. Muggers wait outside the casinos.',
  'Just lost my rent money. Great trip. Really great.',
  'My buddy borrowed from some guy named Tony. Haven\'t seen him since.',
  'Vegas wasn\'t built on winners, pal.',
];

function talkDialog(n, line, buttons = []) {
  n.face = Math.atan2(player.x - n.x, player.y - n.y);
  player.face = Math.atan2(n.x - player.x, n.y - player.y);
  sayBubble(n, line.length > 40 ? line.slice(0, 38) + '…' : line, 4);
  const roleName = { gambler: 'Gambler', dealer: 'Dealer', waitress: 'Cocktail waitress', guard: 'Casino security',
    homeless: 'Homeless man', pedestrian: 'Pedestrian' }[n.role] || '';
  infoDialog(`💬 ${n.name}`, `<div class="talk"><div class="talk-role">${roleName}</div><p class="talk-line">"${line}"</p></div>`, buttons);
}

function talkTo(n) {
  if (blocked()) return;
  clearMovement();
  if (n.service) {
    n.face = Math.atan2(player.x - n.x, player.y - n.y);
    const t = OBJECTS.find(o => o.type === n.service);
    if (t) return interact(t);
  }
  switch (n.role) {
    case 'gambler': {
      const line = pick(GAMBLER_LINES);
      const borrow = Math.random() < 0.25;
      if (borrow) {
        talkDialog(n, "Hey, you look lucky. Lend me $200? I'll pay you back double, I swear.", [
          { label: 'Lend $200', fn: () => {
            if (!pay(200)) return;
            closeModal(true);
            sayBubble(n, 'You\'re a lifesaver!', 4);
            toast(`${n.name} takes your $200 straight to the slot machines. You never see it again.`);
            afterAction();
          } },
        ]);
      } else talkDialog(n, line);
      break;
    }
    case 'dealer': {
      const lines = [
        'Welcome to my table. Minimum bets are posted. Good luck.',
        "Between you and me? Nobody beats this table in the long run. I just deal the cards.",
        'The house thanks you for your business.',
        "Tips are appreciated. They come out of your stack, of course.",
      ];
      talkDialog(n, pick(lines), [
        { label: 'Play this table', cls: 'primary', fn: () => { closeModal(true); interact(n.table); } },
        { label: 'Tip $100', fn: () => {
          if (!pay(100)) return;
          closeModal(true); sayBubble(n, 'Thank you, sir!', 3); afterAction();
        } },
      ]);
      break;
    }
    case 'waitress': {
      const free = hasTier('Silver');
      talkDialog(n, free ? 'Complimentary cocktail for our Silver members?' : "Drinks are complimentary for rewards members. Otherwise it's $12.", [
        { label: free ? 'Cocktail (free)' : 'Cocktail ($12)', cls: 'primary', fn: () => {
          if (free) S.stats.compsValue += 12; else if (!pay(12)) return;
          eat(0, 20, -5, 5); closeModal(true); sayBubble(n, 'Enjoy! Good luck out there.', 3);
          lesson('alcohol', 'Casinos hand out free alcohol because drinking lowers your inhibitions and makes you bet bigger.');
        } },
        { label: free ? 'Water (free)' : 'Water ($4)', fn: () => {
          if (!free && !pay(4)) return;
          eat(0, 30, 0, 3); closeModal(true);
        } },
      ]);
      break;
    }
    case 'guard': {
      let line = 'Evening. Keep it civil and we won\'t have a problem.';
      if (S.equipped) line = 'I see that piece. Keep it holstered in here, or you\'re out on the street.';
      else if (sharkOverdue()) line = 'Couple of guys in leather jackets were asking about you. I\'d watch my back if I were you.';
      else if (S.cash < CONFIG.BROKE_THRESHOLD) line = "Rough night? You wouldn't be the first. Don't go borrowing from the wrong people.";
      talkDialog(n, line);
      break;
    }
    case 'homeless': {
      const broke = S.cash < CONFIG.BROKE_THRESHOLD;
      const line = broke
        ? "Soup kitchen next door serves a hot meal once a day. Tell 'em Eddie sent you. And stay off Tony's books."
        : pick(['Spare some change, friend? I was a Diamond member once. Now look at me.',
          'I had a house, a wife, a boat. Lost it all in there, one "sure thing" at a time.',
          "Careful after dark. The muggers wait for folks who won big inside."]);
      talkDialog(n, line, broke ? [] : [
        { label: 'Give $20', fn: () => { if (!pay(20)) return; closeModal(true); sayBubble(n, 'God bless you.', 4); afterAction(); } },
        { label: 'Give $500', fn: () => {
          if (!pay(500)) return; closeModal(true); sayBubble(n, 'I… thank you. Truly.', 5);
          toast("Eddie: \"Listen. Get out of this town while you still have something.\"");
          afterAction();
        } },
      ]);
      break;
    }
    case 'pedestrian':
      talkDialog(n, pick(PED_LINES));
      break;
    default:
      talkDialog(n, '…');
  }
}

</script>
  <script>
'use strict';

// ---------------------------------------------------------------------------
// Weapons, robbers, Tony's crew and shootouts
// ---------------------------------------------------------------------------
const WEAPONS = {
  pistol: { name: '9mm Pistol', icon: '🔫', price: 1_500, ammoName: 'rounds', ammoPack: 30, ammoPrice: 90, dmg: 38, cool: 0.35 },
  shotgun: { name: 'Pump Shotgun', icon: '💥', price: 3_200, ammoName: 'shells', ammoPack: 16, ammoPrice: 120, dmg: 95, cool: 0.95 },
};
const ARMOR_PRICE = 900;

let fx = [];          // short-lived visual effects (tracers, muzzle flashes)
let fightCtx = null;  // { kind: 'robber' | 'thug', loot, inside }

function resetCombat() {
  fx = [];
  fightCtx = null;
}

function hostiles() { return npcs.filter(n => n.hostile && n.pose !== 'down'); }
function activeOf(role) { return npcs.filter(n => n.role === role && n.state !== 'gone' && n.state !== 'down'); }
function removeNPC(n) { n.state = 'gone'; npcs = npcs.filter(x => x !== n); }

// ---------------------------------------------------------------------------
// Sound (tiny WebAudio synth so there are no files to load)
// ---------------------------------------------------------------------------
let audioCtx = null;
function sfx(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const len = kind === 'shotgun' ? 0.45 : 0.25;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, kind === 'hurt' ? 1 : 3);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = kind === 'hurt' ? 500 : kind === 'shotgun' ? 1400 : 2400;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(kind === 'far' ? 0.25 : 0.6, t);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t);
  } catch (e) { /* audio unavailable */ }
}

// ---------------------------------------------------------------------------
// Spawning
// ---------------------------------------------------------------------------
function isNight() { const h = (S.minutes % 1440) / 60; return h >= 20 || h < 6; }

function spawnRobber() {
  const fromLeft = player.x > 900;
  const x = fromLeft ? Math.max(10, player.x - 650) : Math.min(1790, player.x + 650);
  const r = makeNPC('robber', x, 1112, { name: 'Masked man', talk: false, speed: 140, state: 'approach', hp: 100 });
  npcs.push(r);
  toast('👀 Someone in a hoodie is walking straight toward you…', 'danger', 4000);
}

function spawnThugs(count) {
  for (let i = 0; i < count; i++) {
    const t = makeNPC('thug', 880 + i * 40, 1112, { name: "Tony's guy", talk: false, speed: 175 + 15 * S.shark.overdueDays, state: 'approach', hp: 150, t: 0 });
    npcs.push(t);
  }
  toast(`🕴️ ${count > 1 ? 'Two of Tony\'s guys just showed up' : 'One of Tony\'s guys just showed up'}… and they're looking for you.`, 'danger', 5000);
}

// ---------------------------------------------------------------------------
// Per-frame update
// ---------------------------------------------------------------------------
function updateCombat(dt) {
  fx = fx.filter(f => (f.t -= dt) > 0);

  // Robbers prey on people outside, especially at night and after a big win
  if (isOutside() && S.minutes >= S.nextRobber && !activeOf('robber').length) {
    let chance = isNight() ? 0.55 : 0.2;
    if (S.marked) chance += 0.35;
    if (S.cash < 200) chance *= 0.3;
    if (Math.random() < chance) { spawnRobber(); S.marked = false; }
    S.nextRobber = S.minutes + randInt(90, 180);
  }

  // Tony's crew
  const k = S.shark;
  if (sharkOverdue() && k.nextThug !== null && S.minutes >= k.nextThug && !activeOf('thug').length) {
    spawnThugs(S.tonyAngry > 0 ? 2 : 1);
    k.nextThug = S.minutes + Math.max(60, 240 - 50 * k.overdueDays - 40 * S.tonyAngry);
  }

  for (const n of [...npcs]) {
    if (n.role !== 'robber' && n.role !== 'thug') continue;
    const vx = player.x - n.x, vy = player.y - n.y, d = Math.hypot(vx, vy) || 1;
    switch (n.state) {
      case 'approach': {
        n.pose = 'walk';
        if (n.role === 'robber' && player.y < CASINO_BOTTOM - 20) { n.state = 'leave'; break; } // guards at the door
        if (n.role === 'thug' && !sharkOverdue()) { n.state = 'leave'; break; }
        n.t = (n.t || 0) + dt;
        if (d < 30 || (n.role === 'thug' && n.t > 16)) { confront(n); break; }
        n.face = Math.atan2(vx, vy);
        const sp = n.speed * dt;
        if (!moveEntity(n, vx / d * sp, vy / d * sp, 10)) moveEntity(n, (Math.random() - 0.5) * sp * 3, (Math.random() - 0.5) * sp * 3, 10);
        break;
      }
      case 'fight': {
        n.face = Math.atan2(vx, vy);
        n.pose = 'aim';
        const sp = 90 * dt;
        if (d > 200) moveEntity(n, vx / d * sp, vy / d * sp, 10);
        else if (d < 90) moveEntity(n, -vx / d * sp, -vy / d * sp, 10);
        else moveEntity(n, -vy / d * sp * 0.6 * (n.strafe || 1), vx / d * sp * 0.6 * (n.strafe || 1), 10);
        if (Math.random() < dt * 0.4) n.strafe = -(n.strafe || 1);
        n.cool -= dt;
        if (n.cool <= 0 && !blocked()) {
          n.cool = rand(0.9, 1.7);
          const acc = (n.role === 'thug' ? 0.45 : 0.38) * (d < 160 ? 1 : 0.7) * (player.moving ? 0.75 : 1);
          const hit = Math.random() < acc;
          fx.push({ x1: n.x, y1: n.y, x2: player.x + (hit ? 0 : rand(-40, 40)), y2: player.y + (hit ? 0 : rand(-40, 40)), t: 0.07, enemy: true });
          sfx('far');
          if (hit) damagePlayer(n.role === 'thug' ? randInt(12, 20) : randInt(9, 16));
        }
        if (n.role === 'robber' && n.hp < 40 && Math.random() < dt * 0.8) {
          n.state = 'flee'; n.hostile = false;
          toast('The robber panics and runs off.', 'win');
          checkFightOver();
        }
        break;
      }
      case 'leave': case 'flee': {
        n.pose = 'run';
        const ex = n.role === 'thug' ? 900 : (n.x < 900 ? -40 : 1840), ey = 1112;
        const ux = ex - n.x, uy = ey - n.y, ud = Math.hypot(ux, uy);
        if (ud < 12) { removeNPC(n); break; }
        n.face = Math.atan2(ux, uy);
        n.x += ux / ud * 190 * dt; n.y += uy / ud * 190 * dt;
        break;
      }
      case 'down':
        n.downT -= dt;
        if (n.downT <= 0) removeNPC(n);
        break;
    }
  }
}

// ---------------------------------------------------------------------------
// Confrontations
// ---------------------------------------------------------------------------
function bestWeapon() {
  if (S.weapons.shotgun && S.ammo.shotgun > 0) return 'shotgun';
  if (S.weapons.pistol && S.ammo.pistol > 0) return 'pistol';
  return null;
}

function confront(n) {
  if (blocked()) { closeModal(true); closePhone(); }
  clearMovement();
  n.face = Math.atan2(player.x - n.x, player.y - n.y);
  player.face = Math.atan2(n.x - player.x, n.y - player.y);
  n.state = 'confront';
  n.pose = 'aim';
  const armed = bestWeapon();
  if (n.role === 'thug') return confrontThug(n, armed);

  if (S.cash <= 0) {
    n.state = 'leave';
    S.health = clamp(S.health - 10, 1, 100);
    infoDialog('🥷 Mugged… for nothing', '<p>"Empty pockets? Useless." He shoves you to the ground and walks off.</p><p>Health −10</p>');
    afterAction();
    return;
  }
  const loot = Math.round(Math.min(S.cash, clamp(S.cash * rand(0.08, 0.15), 300, S.marked ? 40_000 : 25_000)));
  const handOver = () => {
    S.cash -= loot; S.stats.robbed++; S.stats.robbedAmount += loot;
    n.state = 'flee';
    closeModal(true);
    toast(`🥷 He grabs ${fmt(loot)} and disappears into the night.`, 'danger', 5000);
    afterAction();
  };
  const buttons = [
    { label: `Hand over ${fmt(loot)}`, fn: handOver },
    { label: 'Run for it', fn: () => {
      closeModal(true);
      if (Math.random() < 0.4) { n.state = 'leave'; toast('🏃 You got away!', 'win'); return; }
      sfx('hurt');
      if (damagePlayer(25, true, loot)) return;
      toast('He catches you, hits you hard, and takes the money.', 'danger', 5000);
      handOver();
    } },
    { label: 'Fight with your fists', fn: () => {
      closeModal(true);
      if (Math.random() < 0.25) { n.state = 'flee'; toast('👊 You land a punch and he runs off!', 'win'); S.stats.fightsWon++; return; }
      sfx('hurt');
      if (damagePlayer(35, true, loot)) return;
      handOver();
    } },
  ];
  if (armed) buttons.unshift({ label: `Draw your ${WEAPONS[armed].name}`, cls: 'danger', fn: () => startFight([n], 'robber', loot) });
  infoDialog('🥷 "Your money. NOW."', `<p>A masked man pulls a gun on you. "Nice and easy. Give me the cash."</p>
    <p>You're carrying <b>${fmt(S.cash)}</b>.</p>
    ${armed ? '' : '<p class="muted">You don\'t have a weapon. The gun store is on the Strip.</p>'}`, buttons);
  lockDialog();
}

// A confrontation can't be dismissed: you have to pick an option
function lockDialog() {
  $('#modal-close').classList.add('hidden');
  const leave = [...document.querySelectorAll('#modal-body .btn.ghost')].pop();
  if (leave) leave.remove();
  modalOnClose = () => false;
}

function confrontThug(n, armed) {
  const others = activeOf('thug');
  if (!armed) { others.forEach(t => { t.state = 'leave'; }); harass(); return; }
  infoDialog("🕴️ Tony's crew found you", `<p>"Tony wants his money. You can make this easy, or you can make this hard."</p>
    <p>You owe Tony <b>${fmt(S.shark.owed)}</b>. You have a ${WEAPONS[armed].name} on you.</p>
    <p class="muted">Fighting back won't erase the debt. Tony will be furious.</p>`, [
    { label: 'Take what\'s coming', fn: () => { others.forEach(t => { t.state = 'leave'; }); closeModal(true); harass(); } },
    { label: `Draw your ${WEAPONS[armed].name}`, cls: 'danger', fn: () => {
      if (others.length < 2) {
        const extra = makeNPC('thug', n.x + 60, n.y + 20, { name: "Tony's guy", talk: false, speed: 170, hp: 150 });
        npcs.push(extra); others.push(extra);
      }
      startFight(others, 'thug');
    } },
  ]);
  lockDialog();
}

function startFight(list, kind, loot = 0) {
  closeModal(true);
  fightCtx = { kind, loot, inside: !isOutside() };
  list.forEach(n => { n.state = 'fight'; n.hostile = true; n.talk = false; n.cool = rand(0.7, 1.4); n.strafe = Math.random() < 0.5 ? 1 : -1; });
  S.equipped = bestWeapon();
  toast('⚠️ SHOOTOUT! Press <b>F</b> or tap an enemy to shoot. <b>Q</b> switches weapon. Keep moving!', 'danger', 6000);
  updateWeaponHUD();
}

function checkFightOver() {
  if (!fightCtx || hostiles().length) return;
  const ctx = fightCtx;
  fightCtx = null;
  if (ctx.kind === 'robber') {
    advanceTime(60);
    infoDialog('🚓 Police on scene', `<p>Police arrive and take your statement. They rule it self-defense.</p>
      <p>That took an hour. You kept your ${fmt(S.cash)}… this time.</p>
      <p class="muted">You fought off a robber, but the casino is still taking your money one bet at a time.</p>`);
  } else {
    const k = S.shark;
    S.tonyAngry++;
    const fee = k.owed * 0.25;
    k.owed += fee;
    k.nextThug = S.minutes + 90;
    addMsg('🦈 Tony', `You put my guys in the hospital?! Your debt just went up ${fmt(fee)} for "damages". Now I send more. You can't shoot your way out of what you owe me.`);
    infoDialog('🕴️ You fought off Tony\'s crew', `<p>They're down, for now. But you still owe Tony <b class="lose">${fmt(k.owed)}</b> (+25% "damages").</p>
      <p class="muted">Violence doesn't cancel a debt. It only makes the next visit worse.</p>`);
  }
  afterAction();
}

// ---------------------------------------------------------------------------
// Player weapons
// ---------------------------------------------------------------------------
let fireCool = 0;
setInterval(() => { fireCool = Math.max(0, fireCool - 0.05); }, 50);

function cycleWeapon() {
  const owned = [null, ...Object.keys(WEAPONS).filter(w => S.weapons[w])];
  if (owned.length === 1) { toast('You don\'t own a weapon. There\'s a gun store on the Strip.'); return; }
  const i = owned.indexOf(S.equipped);
  S.equipped = owned[(i + 1) % owned.length];
  toast(S.equipped ? `${WEAPONS[S.equipped].icon} ${WEAPONS[S.equipped].name} equipped` : '✋ Weapon holstered');
  updateWeaponHUD();
}

function fireWeapon(target) {
  if (blocked()) return;
  if (!S.equipped) {
    if (hostiles().length) { S.equipped = bestWeapon(); updateWeaponHUD(); }
    if (!S.equipped) { if (hostiles().length) toast('No weapon or ammo!', 'danger'); return; }
  }
  const w = WEAPONS[S.equipped];
  if (fireCool > 0) return;
  if (S.ammo[S.equipped] <= 0) { toast(`Out of ${w.ammoName}!`, 'danger'); return; }
  const foes = hostiles();
  if (!target || !target.hostile) {
    target = null;
    let bd = 480;
    foes.forEach(f => { const d = Math.hypot(f.x - player.x, f.y - player.y); if (d < bd) { bd = d; target = f; } });
  }
  S.ammo[S.equipped]--;
  fireCool = w.cool;
  player.shootT = 0.5;
  sfx(S.equipped);
  updateWeaponHUD();
  if (!target) {
    const fx2 = player.x + Math.sin(player.face) * 300, fy2 = player.y + Math.cos(player.face) * 300;
    fx.push({ x1: player.x, y1: player.y, x2: fx2, y2: fy2, t: 0.07 });
    recklessDischarge();
    return;
  }
  player.face = Math.atan2(target.x - player.x, target.y - player.y);
  const d = Math.hypot(target.x - player.x, target.y - player.y);
  const chance = S.equipped === 'shotgun' ? (d < 150 ? 0.92 : d < 300 ? 0.5 : 0.15) : clamp(0.85 - d / 900, 0.25, 0.85);
  const hit = Math.random() < chance;
  fx.push({ x1: player.x, y1: player.y, x2: target.x + (hit ? 0 : rand(-35, 35)), y2: target.y + (hit ? 0 : rand(-35, 35)), t: 0.07 });
  if (!hit) return;
  target.hp -= w.dmg * rand(0.85, 1.15);
  target.hitT = 0.2;
  if (target.hp <= 0) {
    target.hp = 0; target.hostile = false; target.state = 'down'; target.pose = 'down'; target.downT = 8;
    S.stats.fightsWon++;
    checkFightOver();
  }
}

function recklessDischarge() {
  const inside = !isOutside();
  const fine = inside ? 5_000 : 1_000;
  const paid = Math.min(S.cash, fine);
  S.cash -= paid;
  S.medical += fine - paid; // unpaid fines pile onto your debts too
  if (inside) {
    S.weapons = { pistol: false, shotgun: false };
    S.ammo = { pistol: 0, shotgun: 0 };
    S.equipped = null;
    advanceTime(120);
    updateWeaponHUD();
    infoDialog('🚨 Security tackles you', `<p>Firing a gun on the casino floor? Security wrestles you to the ground and hands you over to the police.</p>
      <p>Your weapons are confiscated, you're held for 2 hours and fined <b>${fmt(fine)}</b>.</p>`);
  } else {
    toast(`🚓 People scream and scatter. Police fine you ${fmt(fine)} for firing a gun in public.`, 'danger', 5000);
  }
  afterAction();
}

function damagePlayer(dmg, silent, koLoot = 0) {
  if (S.armor > 0) {
    const absorbed = Math.min(S.armor, dmg * 0.6);
    S.armor -= absorbed; dmg -= absorbed;
  }
  S.health = clamp(S.health - dmg, 0, 100);
  if (!silent) sfx('hurt');
  const h = $('#hurt');
  h.classList.remove('flash'); void h.offsetWidth; h.classList.add('flash');
  if (S.health <= 0) {
    // everyone takes what they came for and leaves
    const ctx = fightCtx;
    fightCtx = null;
    npcs.forEach(n => { if (n.role === 'robber' || n.role === 'thug') { n.hostile = false; n.state = 'leave'; } });
    const loot = ctx && ctx.kind === 'robber' ? ctx.loot * 2 : koLoot;
    if (loot) {
      const take = Math.min(S.cash, loot);
      S.cash -= take; S.stats.robbed++; S.stats.robbedAmount += take;
    }
    if (ctx && ctx.kind === 'thug') S.shark.owed *= 1.1;
    collapse('injury');
    return true;
  }
  return false;
}

// ---------------------------------------------------------------------------
// Gun store
// ---------------------------------------------------------------------------
function gunStore() {
  const rows = [];
  Object.entries(WEAPONS).forEach(([id, w]) => {
    if (!S.weapons[id]) rows.push({ label: `${w.icon} ${w.name} — ${fmt(w.price)} (incl. ${w.ammoPack} ${w.ammoName})`, cls: 'primary', fn: () => {
      if (!pay(w.price)) return;
      S.weapons[id] = true; S.ammo[id] += w.ammoPack; S.equipped = id; S.stats.gunSpend += w.price;
      advanceTime(20);
      closeModal(true);
      toast(`${w.icon} You bought a ${w.name}. Press Q to holster/switch, F to fire.`, 'win', 5000);
      lesson('gun', 'A gun might stop a robber, but it can\'t protect you from the house edge. Most of the money you lose here, you hand over willingly.');
      updateWeaponHUD(); afterAction();
    } });
    else rows.push({ label: `${w.ammoPack} ${w.ammoName} — ${fmt(w.ammoPrice)}`, fn: () => {
      if (!pay(w.ammoPrice)) return;
      S.ammo[id] += w.ammoPack; S.stats.gunSpend += w.ammoPrice;
      closeModal(true); toast(`Bought ${w.ammoPack} ${w.ammoName}.`); updateWeaponHUD(); afterAction();
    } });
  });
  rows.push({ label: `🦺 Body armor — ${fmt(ARMOR_PRICE)}`, disabled: S.armor >= 100, fn: () => {
    if (!pay(ARMOR_PRICE)) return;
    S.armor = 100; S.stats.gunSpend += ARMOR_PRICE;
    closeModal(true); toast('🦺 Body armor on. It absorbs most of the damage from hits.'); afterAction();
  } });
  infoDialog('🔫 Gun Store', `<p>"Lotta desperate people out there at night. You look like you could use some protection."</p>
    <div class="card-box">
      ${Object.entries(WEAPONS).map(([id, w]) => `<div>${w.icon} ${w.name}: ${S.weapons[id] ? `<b>owned</b>, ${S.ammo[id]} ${w.ammoName}` : 'not owned'}</div>`).join('')}
      <div>🦺 Armor: <b>${Math.round(S.armor)}</b>/100</div>
    </div>${statLine()}`, rows);
}

function updateWeaponHUD() {
  const el = $('#weapon');
  if (!el) return;
  if (!S.equipped) { el.innerHTML = '✋'; el.title = 'Unarmed (Q to switch)'; }
  else {
    const w = WEAPONS[S.equipped];
    el.innerHTML = `${w.icon}<small>${S.ammo[S.equipped]}</small>`;
    el.title = w.name;
  }
  $('#fireBtn').classList.toggle('hidden', !S.equipped);
}

  <script>
'use strict';

// ---------------------------------------------------------------------------
// Shared bet selector
// ---------------------------------------------------------------------------
function makeBetBox(min, max, initial) {
  const box = el('div', 'betbox');
  let value = initial || min;
  const cap = () => Math.min(max, Math.floor(S.cash));
  const chips = [1, 10, 100, 1000, 10_000, 100_000, 1_000_000].filter(c => c >= min / 10 && c <= max);
  box.innerHTML = `
    <div class="bet-top">
      <span>Bet</span>
      <input type="number" class="bet-input" min="${min}" max="${max}" step="1">
      <span class="bet-limits">Table limits ${fmtShort(min)} – ${fmtShort(max)}</span>
    </div>
    <div class="chips"></div>`;
  const input = box.querySelector('.bet-input');
  const chipRow = box.querySelector('.chips');
  const set = v => { value = clamp(Math.floor(v) || 0, min, Math.max(min, cap())); input.value = value; };
  chips.forEach(c => {
    const b = el('button', 'chip', '+' + fmtShort(c).replace('$', ''));
    b.onclick = () => set((value === min && c > min ? 0 : value) + c);
    chipRow.appendChild(b);
  });
  [['½', () => set(value / 2)], ['×2', () => set(value * 2)], ['MIN', () => set(min)], ['MAX', () => set(cap())]]
    .forEach(([t, fn]) => { const b = el('button', 'chip alt', t); b.onclick = fn; chipRow.appendChild(b); });
  input.onchange = () => set(Number(input.value));
  set(value);
  return {
    el: box,
    get value() { return value; },
    refresh() { set(value); },
    // Validates and takes the bet; returns the amount or 0
    take(extraCheck) {
      set(Number(input.value));
      if (S.cash < min) { toast(`You need at least ${fmt(min)} to play here.`, 'danger'); return 0; }
      if (value > S.cash) { toast('Not enough cash.', 'danger'); return 0; }
      if (extraCheck && !extraCheck(value)) return 0;
      if (!takeBet(value)) return 0;
      return value;
    },
  };
}

function resultLine(profit) {
  if (profit > 0) return `<span class="win">WIN +${fmt(profit)}</span>`;
  if (profit < 0) return `<span class="lose">LOSE ${fmt(profit)}</span>`;
  return `<span class="push">PUSH (bet returned)</span>`;
}

function gameHeader(edgeText) {
  return `<div class="edge-note">House edge: <b>${edgeText}</b>. On average you lose this much of every dollar you bet.</div>`;
}

function cashLine() {

}
function refreshCash(root) {
