# Builds the Golden Mirage Mac app (.dmg for Apple Silicon and Intel).
# Download it from the run's "Artifacts" section on the Actions tab.
name: Mac app

on:
  workflow_dispatch:
  push:
    branches: [claude/gracious-ptolemy-y0h94n]
    paths: ['desktop/**', 'js/**', 'css/**', 'index.html', 'assets/**', 'tools/build_single.py', '.github/workflows/mac-app.yml']

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build .dmg
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: golden-mirage-mac
          path: desktop/dist/*.dmg
          retention-days: 30
