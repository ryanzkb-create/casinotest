# Builds the Golden Mirage Mac app (.dmg for Apple Silicon and Intel).
# Download it from the run's "Artifacts" section on the Actions tab.
#
# Without secrets the app is ad-hoc signed (macOS shows an "unverified developer"
# warning). With an Apple Developer account, add these repository secrets and the
# same workflow signs with your Developer ID certificate and notarizes with Apple:
#   MAC_CERT_P12                base64 of the "Developer ID Application" certificate (.p12)
#   MAC_CERT_PASSWORD           the password you set when exporting the .p12
#   APPLE_ID                    your Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password from appleid.apple.com
#   APPLE_TEAM_ID               10-character Team ID from developer.apple.com/account
name: Mac app

on:
  workflow_dispatch:
  push:
    branches: [claude/gracious-ptolemy-y0h94n]
    paths: ['desktop/**', 'js/**', 'css/**', 'play.html', 'assets/**', 'tools/build_single.py', '.github/workflows/mac-app.yml']

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      HAVE_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build .dmg (ad-hoc signed)
        shell: bash
        if: env.HAVE_CERT != 'true'
        working-directory: desktop
        run: npm run dist -- -c.mac.identity=- -c.mac.hardenedRuntime=false 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Build .dmg (Developer ID signed and notarized)
        shell: bash
        if: env.HAVE_CERT == 'true'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if ! (npm run dist -- -c.mac.hardenedRuntime=true -c.mac.notarize=true 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0); then
            echo "::warning::Apple notarization failed (see the errors above). Check APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD. Building a signed but not notarized app instead."
            grep -iE "401|invalid credentials|notar" build.log | head -3 | sed 's/^/::warning::/' | cut -c1-300
            npm run dist -- -c.mac.hardenedRuntime=true -c.mac.notarize=false
          fi
      - name: Show build errors
        if: failure()
        working-directory: desktop
        run: |
          # secrets are masked by GitHub; surface the tail of the log as annotations
          # GitHub shows at most 10 annotations per step: keep only the lines that explain the failure
          grep -inE "error|fail|⨯|cannot|denied|invalid|identity|notar|keychain|certificate|password|status" build.log | grep -v "Process completed" | tail -9 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line:0:380}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: golden-mirage-mac
          path: desktop/dist/*.dmg
          retention-days: 30
